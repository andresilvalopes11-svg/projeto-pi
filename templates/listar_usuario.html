{% extends 'base.html' %}

{% block content %}

<h1>Lista de usuário</h1>

<div class = "col text-end">
  <a href="{{ url_for('cadastrarUsuario') }}" class=" btn btn-primary">
    Novo usuário
  </a>
</div>

<table class="table">

  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Nome</th>
      <th scope="col">Tipo</th>
    </tr>
  </thead>

  <tbody>
    {% for i in usuario %}
    <tr>
      <th scope="row">{{i.id}}</th>
      <td>{{i.nome}}</td>
      <td>{{i.tipo}}</td>
      <td class="text-end">
        <div class="action-btns justify-content-end">
          <a href="{{url_for('editarUsuario', id = i['id'])}}" class = "btn btn-sm btn-warning">
            <i class="bi bi-pencil"></i>
            <span class="d-none d-lg-inline ms-1">Editar</span>
          </a>
        </div>
      </td>

      <td class="text-end">
        <div class="action-btns justify-content-end">
          <a href="{{url_for('excluirUsuario', id = i['id'])}}" class = "btn btn-sm btn-danger">
            <i class="bi bi-pencil"></i>
            <span class="d-none d-lg-inline ms-1">Excluir</span>
          </a>
        </div>
      </td>
      
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
